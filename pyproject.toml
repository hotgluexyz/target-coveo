[project]
name = "target-coveo"
version = "0.1.0"
description = "`target-coveo` is a Singer target for the Coveo Push API, built with the Hotglue Singer SDK."
authors = [{ name = "Hotglue", email = "engineering@hotglue.io" }]
keywords = [
    "ELT",
    "coveo",
]
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "requests>=2.25.1",
    # Pinned: DocumentsSink relies on HotglueSink.process_record/state internals.
    "hotglue-singer-sdk==1.0.51",
]

[project.scripts]
target-coveo = 'target_coveo.target:TargetCoveo.cli'

[dependency-groups]
dev = [
    "pytest>=7",
    "responses>=0.25",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"
extend-exclude = ["*.md"]

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",
    "CPY001",
    "FIX002",
    "TD002",
    "TD003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",
  "D103",
  "PLR2004",
  "S101",
]
"target_coveo/client.py" = [
    "ANN401",
    "D102",
    "I001",
]
"target_coveo/sinks.py" = [
    "D102",
    "I001",
]
"target_coveo/target.py" = [
    "RUF012",
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.tox]
requires = ["tox>=4", "tox-uv"]
env_list = ["lint", "3.10"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]

[tool.tox.env.lint]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["ruff", "check", "."], ["ruff", "format", "--check", "."]]
